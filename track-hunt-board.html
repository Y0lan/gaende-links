<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACK HUNT</title>
<style>
:root { --bg:#14090c; --ink:#F0EDE5; --gold:#E08A3C; --red:#EE1F09; --wine:#3a1418; --dim:#9a9086; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,sans-serif}
header{padding:1.25rem 1.25rem .75rem;border-bottom:1px solid #2a1518;position:sticky;top:0;background:var(--bg);z-index:2}
h1{margin:0;font-size:1.1rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--dim);font-size:.8rem;margin-top:.35rem}
.counts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
.pill{border:1px solid #3a2018;padding:.2rem .5rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pill b{color:var(--ink);font-weight:600}
nav{display:flex;gap:.5rem;margin-top:.9rem}
nav button{background:transparent;color:var(--dim);border:1px solid #3a2018;padding:.35rem .7rem;letter-spacing:.1em;text-transform:uppercase;font-size:.7rem;cursor:pointer}
nav button.on{color:var(--gold);border-color:var(--gold)}
main{padding:.5rem 0 3rem}
.row{display:grid;grid-template-columns:3.5rem 7.5rem 1fr auto;gap:.6rem;align-items:baseline;padding:.7rem 1.25rem;border-bottom:1px solid #241014;cursor:pointer}
.row:hover{background:#1c0c10}
.num{color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.st{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
.st.posted{color:var(--ink)}
.st.ready{color:var(--gold)}
.st.queued{color:#c9b59a}
.st.fifo{color:var(--gold)}
.title{font-weight:600}
.meta{color:var(--dim);font-size:.8rem}
.detail{display:none;padding:.4rem 1.25rem 1rem 3.5rem;background:#10070a;border-bottom:1px solid #241014}
.detail.on{display:block}
.track{display:grid;grid-template-columns:1fr auto;gap:.5rem;padding:.35rem 0;border-bottom:1px solid #221114;font-size:.88rem}
.track:last-child{border:0}
.cut{opacity:.45;text-decoration:line-through}
.badges{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:flex-end}
.b{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:.1rem .35rem}
.heart{color:var(--red);margin-right:.35rem}
.empty{color:var(--dim);padding:2rem 1.25rem}
</style>
</head>
<body>
<header>
  <h1>Track Hunt</h1>
  <div class="sub" id="sub">File + fifo. Coming = next 14 days.</div>
  <div class="counts" id="counts"></div>
  <input id="filter" type="search" placeholder="filter album / artist / hunt" autocomplete="off" style="margin-top:.75rem;width:100%;max-width:28rem;background:#10070a;color:var(--ink);border:1px solid #3a2018;padding:.45rem .6rem">
  <nav>
    <button class="on" data-tab="coming">Coming</button>
    <button data-tab="hunts">Hunts</button>
    <button data-tab="queue">Queue</button>
  </nav>
</header>
<main id="main"></main>
<script>
const W = {UTS:"UTS",ANB:"ANB",NIM:"NIM",LIF:"LIF",ESS:"ESS"};
let TAB = "coming";
function badge(w){return `<span class="b">${W[w]||w}</span>`}
function tracksHtml(tracks){
  if(!tracks||!tracks.length) return `<div class="empty">No track list on this hunt file.</div>`;
  return tracks.map(t=>`<div class="track ${t.liked?"":"cut"}">
    <div>${t.liked?'<span class="heart">♥</span>':""}${t.title}<div class="meta">${t.artist||""}</div></div>
    <div class="badges">${(t.worlds||[]).map(badge).join("")}${t.liked?"":'<span class="b">CUT</span>'}</div>
  </div>`).join("");
}
function rowHunt(h,i){
  const id = "h"+i;
  return `<div class="row" data-id="${id}">
    <div class="num">${String(h.hunt??"—").padStart(2,"0")}</div>
    <div class="st ${h.status}">${h.status}</div>
    <div><div class="title">${h.album}</div><div class="meta">${h.artist||h.label||""} · ${h.kept??0} kept · ${h.cut??0} cut${h.spotify_added?" · Spotify":""}</div></div>
    <div class="badges">${(h.worlds_filled||[]).map(badge).join("")}</div>
  </div>
  <div class="detail" id="${id}">${tracksHtml(h.tracks)}</div>`;
}
function rowQueue(a,i){
  const id = "q"+i;
  return `<div class="row" data-id="${id}">
    <div class="num">${String(a.hunt??"—").padStart(2,"0")}</div>
    <div class="st queued">fifo</div>
    <div><div class="title">${a.album}</div><div class="meta">${a.artist||""} · ${a.kind||""} · ${a.leaf_count||"?"} tracks · ${a.kept??0} liked</div></div>
    <div class="badges">${(a.worlds_filled||[]).map(badge).join("")}</div>
  </div>
  <div class="detail" id="${id}">${tracksHtml(a.tracks)}</div>`;
}
function rowComing(c,i){
  const id = "c"+i;
  return `<div class="row" data-id="${id}">
    <div class="num">${String(c.hunt??"—").padStart(2,"0")}</div>
    <div class="st ${c.status||"fifo"}">${c.status||"fifo"}</div>
    <div><div class="title">${c.album||""}</div><div class="meta">${c.when||""} · ${c.slot||""} · ${c.artist||c.label||""}</div></div>
    <div class="badges">${(c.worlds_filled||[]).map(badge).join("")}</div>
  </div>
  <div class="detail" id="${id}">${tracksHtml(c.tracks)}</div>`;
}
function hay(x){
  return [x.hunt,x.album,x.artist,x.label,x.when,x.kind].filter(Boolean).join(" ").toLowerCase();
}
function render(){
  const main = document.getElementById("main");
  const q = (document.getElementById("filter")?.value||"").trim().toLowerCase();
  let rows = TAB==="coming" ? (DATA.coming||[]) : TAB==="hunts" ? DATA.hunts : DATA.queue;
  if(q) rows = rows.filter(x=>hay(x).includes(q));
  const list = TAB==="coming" ? rows.map(rowComing) : TAB==="hunts" ? rows.map(rowHunt) : rows.map(rowQueue);
  main.innerHTML = list.join("") || `<div class="empty">Nothing here.</div>`;
  main.querySelectorAll(".row").forEach(el=>{
    el.onclick=()=>{
      const d=document.getElementById(el.dataset.id);
      const on=d.classList.contains("on");
      main.querySelectorAll(".detail.on").forEach(x=>x.classList.remove("on"));
      if(!on) d.classList.add("on");
    };
  });
}
function counts(d){
  const c=d.counts||{};
  document.getElementById("counts").innerHTML =
    `<span class="pill">file fifo <b>${d.ready_count??0}</b></span>`+
    `<span class="pill">last <b>${d.last_posted??0}</b></span>`+

}
document.querySelectorAll("nav button").forEach(b=>{
